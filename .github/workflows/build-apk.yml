name: Build Offline APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Build Offline Android App
      run: |
        cordova create app com.romodemo.ghars "GharsApp"
        cd app
        cordova platform add android@13.0.0
        
        # إضافة مكتبات الإشعارات وصلاحيات الأندرويد
        cordova plugin add cordova-plugin-local-notification-12
        cordova plugin add cordova-plugin-android-permissions
        
        # حقن صلاحيات المنبه الدقيق والإشعارات
        sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />' platforms/android/app/src/main/AndroidManifest.xml
        
        # إضافة الأيقونة 
        mkdir -p platforms/android/app/src/main/res/mipmap-hdpi
        mkdir -p platforms/android/app/src/main/res/mipmap-mdpi
        mkdir -p platforms/android/app/src/main/res/mipmap-xhdpi
        mkdir -p platforms/android/app/src/main/res/mipmap-xxhdpi
        mkdir -p platforms/android/app/src/main/res/mipmap-xxxhdpi
        cp ../icon.png platforms/android/app/src/main/res/mipmap-hdpi/icon.png
        cp ../icon.png platforms/android/app/src/main/res/mipmap-mdpi/icon.png
        cp ../icon.png platforms/android/app/src/main/res/mipmap-xhdpi/icon.png
        cp ../icon.png platforms/android/app/src/main/res/mipmap-xxhdpi/icon.png
        cp ../icon.png platforms/android/app/src/main/res/mipmap-xxxhdpi/icon.png
        
        rm -rf www/*
        cp ../index.html www/index.html
        
        cordova build android --debug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: Ghars-Offline-APK
        path: app/platforms/android/app/build/outputs/apk/debug/*.apk
