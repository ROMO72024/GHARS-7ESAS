name: Build Ghars Class Alarm APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Build Offline Android App
      run: |
        cordova create app com.romodemo.ghars "منبّه غرس"
        cd app
        cp ../config.xml ./config.xml
        cp ../icon.png ./icon.png
        cordova platform add android@13.0.0
        
        # مكتبة الإشعارات الرسمية المتوافقة مع Cordova Android 13
        cordova plugin add cordova-plugin-local-notification@1.2.3
        
        rm -rf www/*
        cp ../index.html ../styles.css ../schedule-core.js ../app.js ../icon.png www/
        
        cordova build android --debug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: Ghars-Class-Alarm-APK
        path: app/platforms/android/app/build/outputs/apk/debug/*.apk
