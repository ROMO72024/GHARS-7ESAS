name: Build Offline APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Build Offline Android App
      run: |
        cordova create app com.romodemo.ghars "GharsApp"
        cd app
        cordova platform add android@13.0.0
        
        # استخدام مكتبة الإشعارات المحدثة التي تعتمد على منبه النظام (تدعم أندرويد 12 و 13)
        cordova plugin add cordova-plugin-local-notification-12
        cordova plugin add cordova-plugin-background-mode
        
        rm -rf www/*
        cp ../index.html www/index.html
        
        cordova build android --debug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: Ghars-Offline-APK
        path: app/platforms/android/app/build/outputs/apk/debug/*.apk
