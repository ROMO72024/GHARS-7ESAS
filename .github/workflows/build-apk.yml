name: Build Offline APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Build Offline Android App
      run: |
        # إنشاء مشروع أندرويد محلي منفصل عن الإنترنت
        cordova create app com.romodemo.ghars "GharsApp"
        cd app
        
        # إضافة بيئة أندرويد
        cordova platform add android@12.0.1
        
        # إضافة مكتبات الإشعارات المحلية والعمل في الخلفية
        cordova plugin add cordova-plugin-local-notification
        cordova plugin add cordova-plugin-background-mode
        
        # مسح الملفات الافتراضية ونسخ ملف التطبيق الخاص بك
        rm -rf www/*
        cp ../index.html www/index.html
        
        # بناء ملف الـ APK
        cordova build android --debug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: Ghars-Offline-APK
        path: app/platforms/android/app/build/outputs/apk/debug/*.apk
